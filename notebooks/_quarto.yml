project:
  type: website
  output-dir: _site
  # See .quartoignore for ignored files
  render:
    - "*.qmd"
    - "*.ipynb"
    - "!ignored.qmd"
    - "!ignored-dir/"
    - "!upload-to-motherduck.ipynb"
    - "!OCR-tests/"
    - "!archive-analysis/"
    - "!archive-experiment/"
    - "!background/" 

website:
  navbar:
    left:
      - href: index.qmd
        text: Home
      - about.qmd

  sidebar:
    style: "docked"
    search: true

format:
  html:
    theme: cosmo
    # css: styles.css
    toc: true

execute:
  freeze: auto
