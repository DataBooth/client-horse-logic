
[project]
name = "horse-logic"
version = "0.1.0"
description = "Horse Logic - https://horselogic.com.au/about/"
authors = [
    {name = "Michael Booth", email = "michael@databooth.com.au"},
]
dependencies = [
    "pandas>=2.0.2",
    "matplotlib>=3.7.1",
    "fastparquet>=2023.4.0",
    "pandera>=0.14.5",
    "beepy>=1.0.7",
    "openpyxl>=3.1.2",
    "pygame>=2.5.1",
    "Pillow>=10.0.1",
    "toml>=0.10.2",
    "logpai>=1.0.0",
    "itables>=1.6.3",
    "tqdm>=4.66.1",
    "ipywidgets>=8.1.1",
    "vanna>=0.0.36",
    "sqlglot>=20.10.0",
    "duckdb>=0.9.2",
]
requires-python = ">=3.10"
license = {text = "HorseLogic"}
readme = "README.md"

[tool.pdm]
distribution = true
[tool.pdm.dev-dependencies]
dev = [
    "notebook>=6.5.4",
    "black[jupyter]>=23.3.0",
    "pre-commit>=3.3.3",
    "pipdeptree>=2.13.1",
    "pip>=23.3.2",
]
hardware = [
    "pigpio>=1.78",
    "piicodev>=1.10.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
